# Hôtel Evation — PRODUCTION (VPS). Usage: see DOCKER.md
#   cp .env.production.example .env.production   (then fill it in)
#   docker compose up -d --build
services:
  app:
    build:
      context: .
      target: prod
    image: logitel:latest
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - storage:/app/storage          # room photos, logo, logs, sessions files
      - caddy_data:/data/caddy        # HTTPS certificates (once a domain is set)
      - caddy_config:/config/caddy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production         # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD
    volumes:
      - db_data:/var/lib/postgresql/data
    # Not published on the host: only the app container can reach it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  storage:
  caddy_data:
  caddy_config:
  db_data:
